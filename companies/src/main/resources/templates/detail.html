<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${company.name})}"></head>
<body class="bg-black font-sans text-white antialiased">

<div th:replace="~{fragments/layout :: nav}"></div>

<main class="mx-auto max-w-4xl px-5 pb-10 pt-8">

    <a href__="/companies" class="group inline-flex items-center gap-2 text-sm text-neutral-400 transition-colors hover:text-white">
        <svg class="h-4 w-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 12H5m6 6-6-6 6-6"/>
        </svg>
        Back to directory
    </a>

    <!-- HERO -->
    <section class="mt-8 rounded-3xl bg-gradient-to-br from-white/[0.14] via-white/[0.05] to-transparent p-[1px]">
        <div class="rounded-3xl bg-[#0a0a0a] p-8 md:p-10">
            <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
                <img th:src="${company.logoUrl}" th:alt="${company.name}" width="80" height="80"
                     class="h-20 w-20 rounded-2xl border border-white/10 bg-white/[0.04] p-3 object-contain"
                     onerror="this.style.visibility='hidden'"/>

                <div class="flex-1">
                    <div class="flex flex-wrap items-center gap-2">
                        <h1 class="flex items-center gap-2 text-3xl font-extrabold tracking-tight md:text-4xl"
                            th:text="${company.name}">Company</h1>
                        <svg th:if="${company.verified}" class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 1.5 14.4 4l3.5.5.6 3.5L20.5 10 21.8 12l1 2-1 2-1.3 2-2 1.5-.6 3.5-3.5.5L12 24l-2.4-2.5-3.5-.5-.6-3.5L3.5 16 1 14l1-2 1.3-2 2-1.5.6-3.5 3.5-.5z" opacity="0"/>
                            <path d="M9 12l2 2 4-4.5" stroke="currentColor" stroke-width="2.5" fill="none"/>
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <div class="mt-2.5 flex flex-wrap items-center gap-2 text-[13px]">
                        <span class="rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-neutral-300"
                              th:text="${company.category}">Category</span>
                        <span th:if="${company.featured}"
                              class="rounded-full border border-white/15 bg-white/[0.06] px-3 py-1 font-semibold text-white">Featured</span>
                        <span class="flex items-center gap-1.5 text-neutral-300">
                            <svg class="h-3.5 w-3.5 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>
                            </svg>
                            <span class="font-bold" th:text="${#numbers.formatDecimal(company.rating,1,1)}">4.8</span>
                            <span class="text-neutral-500">· <span th:text="${company.reviewCount}">1240</span> reviews</span>
                        </span>
                    </div>
                </div>

                <a th:if="${company.website}" th:href__="${company.website}" target="_blank" rel="noopener"
                   class="inline-flex items-center gap-2 rounded-full bg-white px-5 py-2.5 text-[13px] font-semibold text-black transition-opacity hover:opacity-80">
                    Visit website
                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M7 17 17 7M7 7h10v10"/>
                    </svg>
                </a>
            </div>

            <p class="mt-8 text-[15px] leading-relaxed text-neutral-300" th:text="${company.description}">
                Description
            </p>
        </div>
    </section>

    <!-- SPEC SHEET -->
    <section class="mt-6 grid grid-cols-2 gap-4 md:grid-cols-4">
        <div class="rounded-2xl border border-white/[0.07] bg-white/[0.02] p-5 transition-colors hover:border-white/20">
            <p class="text-[11px] font-semibold uppercase tracking-wider text-neutral-500">Headquarters</p>
            <p class="mt-2 text-sm font-semibold" th:text="${company.headquarters ?: '—'}">San Francisco, USA</p>
        </div>
        <div class="rounded-2xl border border-white/[0.07] bg-white/[0.02] p-5 transition-colors hover:border-white/20">
            <p class="text-[11px] font-semibold uppercase tracking-wider text-neutral-500">Founded</p>
            <p class="mt-2 text-sm font-semibold" th:text="${company.foundedYear ?: '—'}">2015</p>
        </div>
        <div class="rounded-2xl border border-white/[0.07] bg-white/[0.02] p-5 transition-colors hover:border-white/20">
            <p class="text-[11px] font-semibold uppercase tracking-wider text-neutral-500">Team size</p>
            <p class="mt-2 text-sm font-semibold" th:text="${company.employees ?: '—'}">501-1000</p>
        </div>
        <div class="rounded-2xl border border-white/[0.07] bg-white/[0.02] p-5 transition-colors hover:border-white/20">
            <p class="text-[11px] font-semibold uppercase tracking-wider text-neutral-500">Category</p>
            <p class="mt-2 text-sm font-semibold" th:text="${company.category}">LLM</p>
        </div>
    </section>

    <a href__="/companies"
       class="mt-10 inline-flex items-center gap-2 rounded-full border border-white/15 px-5 py-2.5 text-[13px]
              font-medium text-neutral-300 transition-all hover:border-white/40 hover:text-white">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 12H5m6 6-6-6 6-6"/>
        </svg>
        Browse all companies
    </a>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
