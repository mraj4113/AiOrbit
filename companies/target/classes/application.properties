spring.application.name=companies
# ===== Server =====
server.port=8080

# ===== MySQL Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/aiorbit?serverTimezone=UTC&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=mayank
# ⚠️ Set this to your local MySQL password configured in Workbench
spring.datasource.password=kill.end0

# ===== JPA / Hibernate =====
# 'update' automatically updates your schema structures without wiping database records on restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Thymeleaf View Rendering =====
spring.thymeleaf.cache=false

# ===== Jackson Payload Formatting =====
spring.jackson.default-property-inclusion=non_null
