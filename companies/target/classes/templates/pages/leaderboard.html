<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leaderboard')}"></head>
<body class="bg-[#0a0a0a] font-sans text-white antialiased">

<div th:replace="~{fragments/layout :: nav}"></div>

<main class="mx-auto max-w-3xl px-5 pb-10 pt-14">
    <p class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-[#a3a3a3]">The Leaderboard</p>
    <h1 class="text-4xl font-extrabold tracking-tight md:text-5xl">Top 10 AI Companies</h1>
    <p class="mt-3 max-w-xl text-[15px] leading-relaxed text-[#a3a3a3]">
        Ranked by community rating, updated continuously.
    </p>

    <div class="mt-10 flex flex-col gap-3">
        <a th:each="c, i : ${companies}" th:href__="@{'/companies/' + ${c.slug}}"
           class="group flex items-center gap-4 rounded-2xl border border-[#262626] bg-[#171717] p-4 transition-all hover:border-white/30">

            <span class="w-8 text-center text-lg font-extrabold text-[#a3a3a3]"
                  th:text="${i.index + 1}">1</span>

            <img th:src="${c.logoUrl}" th:alt="${c.name}" width="40" height="40"
                 class="h-10 w-10 rounded-xl border border-[#262626] bg-white/[0.04] p-1.5 object-contain"
                 onerror="this.style.visibility='hidden'"/>

            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5">
                    <p class="truncate text-sm font-bold" th:text="${c.name}">Name</p>
                    <svg th:if="${c.verified}" class="h-3.5 w-3.5 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <p class="truncate text-xs text-[#a3a3a3]" th:text="${c.category}">Category</p>
                <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-[#262626]">
                    <div class="h-full rounded-full bg-white"
                         th:style="'width:' + ${c.rating * 20} + '%'"></div>
                </div>
            </div>

            <div class="text-right">
                <p class="text-sm font-bold" th:text="${#numbers.formatDecimal(c.rating,1,1)}">4.8</p>
                <p class="text-xs text-[#a3a3a3]" th:text="${c.reviewCount} + ' reviews'">1240 reviews</p>
            </div>

            <svg class="h-4 w-4 text-neutral-600 transition-all group-hover:translate-x-1 group-hover:text-white"
                 fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M5 12h14m-6-6 6 6-6 6"/>
            </svg>
        </a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
