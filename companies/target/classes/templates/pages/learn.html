<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Learn')}"></head>
<body class="bg-[#0a0a0a] font-sans text-white antialiased">

<div th:replace="~{fragments/layout :: nav}"></div>

<main class="mx-auto max-w-6xl px-5 pb-10 pt-14">
    <p class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-[#a3a3a3]">The Learning Hub</p>
    <h1 class="text-4xl font-extrabold tracking-tight md:text-5xl">Learn AI, Structured</h1>
    <p class="mt-3 max-w-xl text-[15px] leading-relaxed text-[#a3a3a3]">
        Curated learning tracks that take you from fundamentals to frontier research.
    </p>

    <div class="mt-12 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <div th:each="t : ${ { {'Prompt Engineering','Master the craft of designing effective prompts for LLMs, from zero-shot basics to advanced chain-of-thought techniques.','Beginner'}, {'LLM Fundamentals','Transformers, tokens, embeddings and attention — understand how modern language models actually work.','Beginner'}, {'Building with AI APIs','Integrate LLM APIs into production apps: streaming, function calling, RAG pipelines and cost control.','Intermediate'}, {'Fine-Tuning & Evaluation','LoRA, RLHF and benchmark design — take a base model and make it yours.','Advanced'}, {'Multimodal Systems','Image, audio and video understanding — combining modalities into cohesive AI products.','Intermediate'}, {'AI Safety & Alignment','An overview of interpretability, red-teaming and the alignment research landscape.','Advanced'} } }"
             class="rounded-2xl border border-[#262626] bg-[#171717] p-6 transition-all hover:-translate-y-1 hover:border-white/25">
            <span class="rounded-full border border-[#262626] bg-white/[0.04] px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-[#a3a3a3]"
                  th:text="${t[2]}">Beginner</span>
            <h3 class="mt-4 text-lg font-bold tracking-tight" th:text="${t[0]}">Track</h3>
            <p class="mt-2 text-sm leading-relaxed text-[#a3a3a3]" th:text="${t[1]}">Description</p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
