<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' · AI Orbit'">AI Orbit</title>
    <meta name="description" content="AI Orbit — a curated directory of leading AI companies."/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        base: '#000000',
                        surface: '#0a0a0a',
                        elevated: '#111111',
                        line: '#1f1f1f',
                        accent: '#ffffff'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href__="https://fonts.googleapis.com"/>
    <link href__="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { background: #000; }
        ::selection { background: rgba(255,255,255,.9); color: #000; }
        .card-glow { position: relative; }
        .card-glow::after {
            content: ''; position: absolute; inset: 0; border-radius: 1rem;
            background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 0%),
                rgba(255,255,255,.06), transparent 40%);
            opacity: 0; transition: opacity .4s ease; pointer-events: none;
        }
        .card-glow:hover::after { opacity: 1; }
    </style>
</head>
<body>
<!-- NAVBAR -->
<nav th:fragment="nav" class="sticky top-0 z-50 border-b border-white/[0.06] bg-black/70 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
        <a href__="/companies" class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm font-extrabold text-black">O</span>
            <span class="text-[15px] font-bold tracking-tight text-white">AI Orbit</span>
        </a>
        <div class="hidden items-center gap-8 text-sm text-neutral-400 md:flex">
            <a href__="/companies" class="transition-colors hover:text-white">Directory</a>
             <a href__="/leaderboard" class="transition-colors hover:text-white">Leaderboard</a>
            <a href__="/learn" class="transition-colors hover:text-white">Learn</a>
        </div>
        <a href__="/companies" class="rounded-full bg-white px-4 py-2 text-[13px] font-semibold text-black transition-opacity hover:opacity-80">
            Explore
        </a>
    </div>
</nav>

<!-- FOOTER -->
<footer th:fragment="footer" class="mt-24 border-t border-white/[0.06] py-10">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-3 px-5 text-sm text-neutral-500 md:flex-row">
        <p>© 2026 AI Orbit — Curating the AI ecosystem.</p>
        <div class="flex gap-6">
            <a href__="#" class="transition-colors hover:text-white">About</a>
            <a href__="#" class="transition-colors hover:text-white">Privacy</a>
            <a href__="#" class="transition-colors hover:text-white">Contact</a>
        </div>
    </div>
</footer>
</body>
</html>
